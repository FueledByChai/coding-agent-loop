name: CI

# The definition of done, run by the same script a developer runs locally (the `check` in
# .loop.toml), so CI and the checkout agree on what "passing" means. One job per check
# command; each job's `name` is a required status check in the branch ruleset
# (ci/ruleset.json), and a pull request must be up to date with the default branch when the
# jobs pass, so after another PR merges a branch is rebased (scripts/open-ticket-pr.sh <id>
# --update) and the jobs run again on the exact result that would land.
#
# Add the toolchain steps your check needs before the `run` line (language setup, caches,
# browsers). Split the check into more jobs by giving the script flags and adding a job per
# flag, each with its own name in the ruleset.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check (scripts/check.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Beads is a hard dependency of the loop: the ticket queue lives in the Dolt database
      # behind refs/dolt/data, not in the working tree, so every project's runner installs the
      # pinned release and bootstraps the queue before its check. A project whose queue is not
      # published (bd dolt push) fails here, which is the point: the check reads the queue.
      - name: Install Beads
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/bd-extract"
          curl -fsSL "https://github.com/gastownhall/beads/releases/download/v1.3.0/beads_1.3.0_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bd-extract"
          mv "$RUNNER_TEMP/bd-extract/bd" "$RUNNER_TEMP/bin/bd"
          chmod +x "$RUNNER_TEMP/bin/bd"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/bd" version
      - name: Bootstrap the Beads queue
        run: bd bootstrap --yes
      - run: scripts/check.sh
