name: CI

# The definition of done, run by the same script a developer runs locally (the `check` in
# .loop.toml), so CI and the checkout agree on what "passing" means. One job per check
# command; each job's `name` is a required status check in the branch ruleset
# (ci/ruleset.json), and a pull request must be up to date with the default branch when the
# jobs pass. Only the selected candidate is refreshed after predecessors land; complete
# review and independent acceptance on that head before adding ci:run (README, 0020).
# Waiting PRs receive no request. Opening, pushing, marking ready and merging do not build.
#
# GitHub cannot filter pull_request label events by label name. Do not put a job-level if:
# on the label: a skipped required job can satisfy branch protection without running tests.
# The first step instead FAILS unrelated requests before checkout or expensive work. This
# produces a cheap red check, never a skipped green one. Labels are cooperative requests,
# not trusted queue admission; LK-e9y supplies the separate App gate and controller.
# https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/troubleshooting-required-status-checks
#
# Add the toolchain steps your check needs before the `run` line (language setup, caches,
# browsers). Split the check into more jobs by giving the script flags and adding a job per
# flag, each with its own name in the ruleset.

on:
  pull_request:
    types: [labeled]

jobs:
  check:
    name: Check (scripts/check.sh)
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI request
        shell: bash
        env:
          REQUEST_EVENT: ${{ github.event_name }}
          REQUEST_ACTION: ${{ github.event.action }}
          REQUEST_LABEL: ${{ github.event.label.name }}
          REQUEST_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$REQUEST_EVENT" != pull_request ] || [ "$REQUEST_ACTION" != labeled ] || [ "$REQUEST_LABEL" != ci:run ] || [ "$REQUEST_DRAFT" != false ]; then
            echo 'Full CI was not requested for a ready PR; rejecting before checkout.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # Add toolchain steps below this line.
      # The queue checks read the commits, and a shallow clone leaves git log origin/main with
      # only the tip, so --reconcile cannot see the commits a closed ticket names (LK-48).
      - name: Fetch the queue's history
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow
          fi
      # Beads is a hard dependency of the loop: the ticket queue lives in the Dolt database
      # behind refs/dolt/data, not in the working tree, so every project's runner installs the
      # pinned release and bootstraps the queue before its check. A project whose queue is not
      # published (bd dolt push) fails here, which is the point: the check reads the queue.
      - name: Install Beads
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/bd-extract"
          curl -fsSL "https://github.com/gastownhall/beads/releases/download/v1.3.0/beads_1.3.0_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bd-extract"
          mv "$RUNNER_TEMP/bd-extract/bd" "$RUNNER_TEMP/bin/bd"
          chmod +x "$RUNNER_TEMP/bin/bd"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/bd" version
      - name: Bootstrap the Beads queue
        run: bd bootstrap --yes
      - run: scripts/check.sh
