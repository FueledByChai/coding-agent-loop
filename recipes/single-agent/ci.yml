name: CI

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (scripts/check.sh)
    runs-on: ubuntu-latest
    steps:
      - name: Admit the final reviewed head
        env:
          REQUESTED_LABEL: ${{ github.event.label.name }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        shell: bash
        run: |
          # >>> single-agent admission (validate.sh executes this block as a fixture)
          if [ "$REQUESTED_LABEL" != "ci:run" ]; then
            echo "full CI requires the ci:run label" >&2
            exit 1
          fi
          if [ "$PR_DRAFT" != "false" ]; then
            echo "full CI requires a ready pull request" >&2
            exit 1
          fi
          # <<< single-agent admission
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Add project toolchain and cache setup here.
      - run: scripts/check.sh
