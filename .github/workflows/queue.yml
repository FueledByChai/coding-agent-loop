# Dedicated queue workflow; inactive without App-issued admission. Legacy CI stays in place during bootstrap.
name: Queue CI
run-name: queue:${{ inputs.attempt }}
on:
  workflow_dispatch:
    inputs:
      attempt:
        required: true
        type: string
      head:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      app_id:
        required: true
        type: string
permissions:
  contents: read
  checks: read
jobs:
  check:
    name: Queue full check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Queue admission
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_ATTEMPT: ${{ inputs.attempt }}
          QUEUE_HEAD: ${{ inputs.head }}
          QUEUE_BASE: ${{ inputs.base_sha }}
          QUEUE_REQUEST_APP: ${{ inputs.app_id }}
          QUEUE_APP_ID: '5024825'
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, time
          from urllib.request import Request, urlopen
          e = os.environ
          assert e['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          assert e['GITHUB_RUN_ATTEMPT'] == '1', 'reruns require new queue admission'
          assert e['QUEUE_APP_ID'].isdigit() and int(e['QUEUE_APP_ID']) > 0
          assert e['QUEUE_REQUEST_APP'] == e['QUEUE_APP_ID']
          assert re.fullmatch('[0-9a-f]{32}', e['QUEUE_ATTEMPT'])
          assert re.fullmatch('[0-9a-f]{40}', e['QUEUE_HEAD'])
          assert e['QUEUE_BASE'] == e['GITHUB_SHA'] and re.fullmatch('[0-9a-f]{40}', e['QUEUE_BASE'])
          expected = dict(repository=e['GITHUB_REPOSITORY'], app_id=int(e['QUEUE_APP_ID']),
              attempt=e['QUEUE_ATTEMPT'], head=e['QUEUE_HEAD'], base_sha=e['QUEUE_BASE'], run_id=int(e['GITHUB_RUN_ID']))
          external_id = 'queue-admission-v1:' + hashlib.sha256(json.dumps(expected, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          def authorized(checks):
              matches = []
              for check in checks:
                  if check.get('name') != 'Queue CI admission' or check.get('app', {}).get('id') != expected['app_id']:
                      continue
                  if check.get('external_id') == external_id: matches.append(check)
              return len(matches) == 1 and matches[0]['status'] == 'in_progress'
          for _ in range(24):
              checks = []; page = 1; seen = set()
              while True:
                  url = 'https://api.github.com/repos/' + e['GITHUB_REPOSITORY'] + '/commits/' + e['QUEUE_BASE'] + '/check-runs?filter=all&per_page=100&page=' + str(page)
                  request = Request(url, headers={'Authorization': 'Bearer ' + e['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
                  with urlopen(request, timeout=15) as response: data = json.load(response)
                  rows = data['check_runs']
                  assert isinstance(rows, list), 'invalid admission inventory'
                  if rows:
                      fingerprint = hashlib.sha256(json.dumps(rows, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
                      assert fingerprint not in seen, 'admission inventory repeated a page'
                      seen.add(fingerprint)
                  checks.extend(rows)
                  if len(rows) < 100: break
                  page += 1
              if authorized(checks): break
              time.sleep(5)
          else: raise SystemExit('no trusted admission for this exact run/head/base')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Beads
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/bd-extract"
          curl -fsSL "https://github.com/gastownhall/beads/releases/download/v1.3.0/beads_1.3.0_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bd-extract"
          mv "$RUNNER_TEMP/bd-extract/bd" "$RUNNER_TEMP/bin/bd"
          chmod +x "$RUNNER_TEMP/bin/bd"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/bd" version
      - name: Bootstrap the Beads queue
        run: bd bootstrap --yes
      - name: Full check
        run: ./check.sh
