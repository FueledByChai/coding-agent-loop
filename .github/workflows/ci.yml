name: CI

# The kit's definition of done, the same script a developer runs locally (check.sh): every
# script's self-test and the install into a fresh repository.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check (check.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The queue lives in Beads, behind the refs/dolt/data ref rather than in the working
      # tree, so the runner installs the pinned release and bootstraps the queue before the
      # check: the same tickets a checkout reads, read from the same database name.
      - name: Install Beads
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/bd-extract"
          curl -fsSL "https://github.com/gastownhall/beads/releases/download/v1.3.0/beads_1.3.0_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bd-extract"
          mv "$RUNNER_TEMP/bd-extract/bd" "$RUNNER_TEMP/bin/bd"
          chmod +x "$RUNNER_TEMP/bin/bd"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/bd" version
      - name: Bootstrap the Beads queue
        run: bd bootstrap --yes
      - run: ./check.sh
